<!DOCTYPE html><html>
<head>
  <title>Premium Scratch Card</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #111;
    }
    canvas {
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(255,255,255,0.2);
    }
  </style>
</head>
<body><canvas id="canvas"></canvas>

<!-- Scratch sound --><audio id="scratchSound" src="scratch.mp3" preload="auto"></audio>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const sound = document.getElementById("scratchSound");

canvas.width = 360;
canvas.height = 640;

// Images
const bg = new Image();        // poem
const shinchan = new Image();  // top print

bg.src = "poem.jpg";
shinchan.src = "shinchan.jpg";

// Create silver layer
function createSilverLayer() {
  let grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
  grad.addColorStop(0, "#c0c0c0");
  grad.addColorStop(0.5, "#f5f5f5");
  grad.addColorStop(1, "#a9a9a9");

  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // noise texture
  for (let i = 0; i < 10000; i++) {
    let x = Math.random() * canvas.width;
    let y = Math.random() * canvas.height;
    let alpha = Math.random() * 0.25;
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.fillRect(x, y, 1, 1);
  }
}

bg.onload = () => {
  ctx.drawImage(bg, 0, 0, canvas.width, canvas.height);

  shinchan.onload = () => {
    // Silver base
    createSilverLayer();

    // Shinchan printed ON silver
    ctx.globalAlpha = 0.9;
    ctx.drawImage(shinchan, 0, 0, canvas.width, canvas.height);
    ctx.globalAlpha = 1;

    // Enable scratch
    ctx.globalCompositeOperation = "destination-out";

    let isDrawing = false;

    function scratch(e) {
      if (!isDrawing) return;

      let rect = canvas.getBoundingClientRect();
      let x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
      let y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;

      // Play sound
      sound.currentTime = 0;
      sound.play();

      ctx.beginPath();
      ctx.arc(x, y, 25, 0, Math.PI * 2);
      ctx.fill();
    }

    canvas.addEventListener("mousedown", () => isDrawing = true);
    canvas.addEventListener("mouseup", () => isDrawing = false);
    canvas.addEventListener("mousemove", scratch);

    canvas.addEventListener("touchstart", () => isDrawing = true);
    canvas.addEventListener("touchend", () => isDrawing = false);
    canvas.addEventListener("touchmove", scratch);
  };
};
</script></body>
</html>
