<!DOCTYPE html><html>
<head>
  <title>Ultimate Scratch Card</title>
  <style>
    body {
      margin: 0;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    canvas {
      border-radius: 20px;
      touch-action: none;
    }
  </style>
</head>
<body><canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

// 📱 Responsive
let ratio = window.devicePixelRatio || 1;
let width = Math.min(window.innerWidth * 0.9, 420);
let height = width * 1.7;

canvas.style.width = width + "px";
canvas.style.height = height + "px";
canvas.width = width * ratio;
canvas.height = height * ratio;

ctx.scale(ratio, ratio);

// Images
const poem = new Image();
const shinchan = new Image();

poem.src = "Poem.jpg";
shinchan.src = "shinchan.jpg";

// Scratch mask canvas (important)
const maskCanvas = document.createElement("canvas");
const maskCtx = maskCanvas.getContext("2d");

maskCanvas.width = width;
maskCanvas.height = height;

// Fill mask with silver
function drawSilver() {
  let grad = maskCtx.createLinearGradient(0,0,width,height);
  grad.addColorStop(0,"#cfcfcf");
  grad.addColorStop(0.5,"#f5f5f5");
  grad.addColorStop(1,"#9e9e9e");

  maskCtx.fillStyle = grad;
  maskCtx.fillRect(0,0,width,height);

  for(let i=0;i<6000;i++){
    maskCtx.fillStyle = `rgba(255,255,255,${Math.random()*0.2})`;
    maskCtx.fillRect(Math.random()*width,Math.random()*height,1,1);
  }
}

// Glitter
let particles=[];
function addParticles(x,y){
  for(let i=0;i<5;i++){
    particles.push({
      x,y,
      vx:(Math.random()-0.5)*2,
      vy:(Math.random()-0.5)*2,
      life:25
    });
  }
}

function drawParticles(){
  particles.forEach(p=>{
    ctx.fillStyle=`rgba(255,215,0,${p.life/25})`;
    ctx.fillRect(p.x,p.y,2,2);
    p.x+=p.vx;
    p.y+=p.vy;
    p.life--;
  });
  particles=particles.filter(p=>p.life>0);
}

// Scratch tracking
let scratchedPixels = 0;
let totalPixels = width * height;
let revealDone = false;

function scratch(x,y){
  maskCtx.globalCompositeOperation="destination-out";
  maskCtx.beginPath();
  maskCtx.arc(x,y,22,0,Math.PI*2);
  maskCtx.fill();

  scratchedPixels += 1500; // approx
  addParticles(x,y);

  if(!revealDone && scratchedPixels/totalPixels > 0.7){
    revealDone = true;
    fadeToPoem();
  }
}

// Smooth reveal
let revealAlpha = 0;
function fadeToPoem(){
  let interval = setInterval(()=>{
    revealAlpha += 0.05;
    if(revealAlpha >= 1){
      revealAlpha = 1;
      clearInterval(interval);
    }
  },30);
}

// Draw loop
function draw(){
  ctx.clearRect(0,0,width,height);

  // Base = poem
  ctx.drawImage(poem,0,0,width,height);

  // Silver + Shinchan layer
  ctx.globalAlpha = 1 - revealAlpha;
  ctx.drawImage(maskCanvas,0,0,width,height);
  ctx.drawImage(shinchan,0,0,width,height);

  ctx.globalAlpha = 1;

  drawParticles();

  requestAnimationFrame(draw);
}

// Input
let isDrawing=false;

function getPos(e){
  let rect = canvas.getBoundingClientRect();
  return {
    x:(e.touches?e.touches[0].clientX:e.clientX)-rect.left,
    y:(e.touches?e.touches[0].clientY:e.clientY)-rect.top
  };
}

canvas.addEventListener("mousedown",()=>isDrawing=true);
canvas.addEventListener("mouseup",()=>isDrawing=false);
canvas.addEventListener("mousemove",(e)=>{
  if(!isDrawing) return;
  let p=getPos(e);
  scratch(p.x,p.y);
});

canvas.addEventListener("touchstart",()=>isDrawing=true);
canvas.addEventListener("touchend",()=>isDrawing=false);
canvas.addEventListener("touchmove",(e)=>{
  let p=getPos(e);
  scratch(p.x,p.y);
});

// Load + start
poem.onload = ()=>{
  shinchan.onload = ()=>{
    drawSilver();
    draw();
  };
};
</script></body>
</html>
