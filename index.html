<!DOCTYPE html><html>
<head>
  <title>Ultra Scratch Card</title>
  <style>
    body {
      margin: 0;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    canvas {
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(255,255,255,0.2);
      touch-action: none;
    }
  </style>
</head>
<body><canvas id="canvas"></canvas>
<audio id="scratchSound" src="scratch.mp3" loop></audio>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const sound = document.getElementById("scratchSound");

// 📱 Responsive size
let ratio = window.devicePixelRatio || 1;
let width = Math.min(window.innerWidth * 0.9, 420);
let height = width * 1.7;

canvas.style.width = width + "px";
canvas.style.height = height + "px";
canvas.width = width * ratio;
canvas.height = height * ratio;

ctx.scale(ratio, ratio);

// Images
const bg = new Image();
const shinchan = new Image();

bg.src = "Poem.jpg";
shinchan.src = "shinchan.jpg";

// 🪙 Silver layer
function createSilverLayer() {
  let grad = ctx.createLinearGradient(0, 0, width, height);
  grad.addColorStop(0, "#cfcfcf");
  grad.addColorStop(0.5, "#f5f5f5");
  grad.addColorStop(1, "#9e9e9e");

  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, width, height);

  // noise
  for (let i = 0; i < 6000; i++) {
    ctx.fillStyle = `rgba(255,255,255,${Math.random()*0.2})`;
    ctx.fillRect(Math.random()*width, Math.random()*height, 1, 1);
  }
}

// ✨ Glitter particles
let particles = [];

function addParticles(x, y) {
  for (let i = 0; i < 6; i++) {
    particles.push({
      x, y,
      vx: (Math.random()-0.5)*2,
      vy: (Math.random()-0.5)*2,
      life: 30
    });
  }
}

function drawParticles() {
  particles.forEach(p => {
    ctx.fillStyle = "rgba(255,215,0," + (p.life/30) + ")";
    ctx.fillRect(p.x, p.y, 2, 2);
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
  });
  particles = particles.filter(p => p.life > 0);
}

// Draw everything
bg.onload = () => {
  ctx.drawImage(bg, 0, 0, width, height);

  shinchan.onload = () => {
    createSilverLayer();

    ctx.globalAlpha = 0.9;
    ctx.drawImage(shinchan, 0, 0, width, height);
    ctx.globalAlpha = 1;

    ctx.globalCompositeOperation = "destination-out";

    let isDrawing = false;

    function getPos(e) {
      let rect = canvas.getBoundingClientRect();
      return {
        x: (e.touches ? e.touches[0].clientX : e.clientX) - rect.left,
        y: (e.touches ? e.touches[0].clientY : e.clientY) - rect.top
      };
    }

    function scratch(e) {
      if (!isDrawing) return;

      let {x, y} = getPos(e);

      ctx.beginPath();
      ctx.arc(x, y, 22, 0, Math.PI*2);
      ctx.fill();

      addParticles(x, y);
    }

    canvas.addEventListener("mousedown", () => {
      isDrawing = true;
      sound.play().catch(()=>{});
    });

    canvas.addEventListener("mouseup", () => {
      isDrawing = false;
      sound.pause();
    });

    canvas.addEventListener("mousemove", scratch);

    canvas.addEventListener("touchstart", (e) => {
      isDrawing = true;
      sound.play().catch(()=>{});
    });

    canvas.addEventListener("touchend", () => {
      isDrawing = false;
      sound.pause();
    });

    canvas.addEventListener("touchmove", scratch);

    // ✨ animation loop
    function animate() {
      requestAnimationFrame(animate);
      drawParticles();
    }
    animate();
  };
};
</script></body>
</html>
